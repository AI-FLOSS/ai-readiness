name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run tests
        run: npm test
      - name: Score this repository with the action
        id: readiness
        uses: ./
        with:
          min-score: 4
      - run: echo "Scored ${{ steps.readiness.outputs.score }}/4"
